name: Quality gates

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, evaluate, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm run test

      - name: Enforce RAG evaluation thresholds
        run: npm run eval:policy

      - name: Build all workspaces
        run: npm run build

      - name: Synthesize AWS infrastructure without deployment
        run: npm run synth:infra

      - name: Lint web application
        run: npm run lint
